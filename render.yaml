services:
  - type: web
    name: tripreality-backend
    runtime: python
    plan: free
    repo: https://github.com/kshitijshresth/tripreality.git
    branch: master
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: tripreality
      - key: CORS_ORIGINS
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NVIDIA_NIM_URL
        sync: false
      - key: NVIDIA_NIM_MODEL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_URL
        sync: false
      - key: GROQ_MODEL
        sync: false
